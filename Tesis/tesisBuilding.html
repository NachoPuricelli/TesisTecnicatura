<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="shortcut icon" href="https://cdn.icon-icons.com/icons2/656/PNG/512/settings_online_web_pc_mac_monitor_icon-icons.com_59975.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Building - PCRepair</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .btn { font-size: large; }
    .btn:hover { transform: scale(1.2); transition: transform 0.3s ease; filter: drop-shadow(2px 2px 2px #000); }
  </style>
</head>

<body>
  <div class="container py-2">
    <div class="card bg-light">
      <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="index.html">
          <img src="https://cdn.icon-icons.com/icons2/656/PNG/512/settings_online_web_pc_mac_monitor_icon-icons.com_59975.png" class="ms-3" alt="" height="100px">
        </a>
        <h1>PCRepair</h1>
        <div class="position-absolute top-50 start-50 translate-middle">
          <h2 class="mt-2 text-primary">Especificaciones generales</h2>
        </div>
      </nav>
    </div>
    
    <hr>
    
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
      <div class="col d-flex">
        <div class="card bg-light">
          <div class="card-header bg-danger text-white">
            <h1 class="h3 card-title text-center">PC Doméstica</h1>
          </div>
          <div class="card-body">
            <ul class="fw-bold">
              <li>Procesador: Gama media</li>
              <li>RAM: 4GB - 8GB</li>
              <li>Almacenamiento: HDD 500GB / 1TB</li>
            </ul>
          </div>
        </div>
      </div>

      <div class="col d-flex">
        <div class="card bg-light">
          <div class="card-header bg-success text-white">
            <h1 class="h3 card-title text-center">PC Oficina</h1>
          </div>
          <div class="card-body">
            <ul class="fw-bold">
              <li>Procesador: Gama media a alta</li>
              <li>RAM: 8GB - 16GB</li>
            </ul>
          </div>
        </div>
      </div>

      <div class="col d-flex">
        <div class="card bg-light">
          <div class="card-header bg-warning">
            <h1 class="h3 card-title text-center">PC Gaming</h1>
          </div>
          <div class="card-body">
            <ul class="fw-bold">
              <li>Procesador: Gama alta</li>
              <li>RAM: 16GB+</li>
              <li>Gráfica: Alta gama</li>
            </ul>
          </div>
        </div>
      </div>
    </div>

    <hr>
    <div class="d-flex justify-content-center mb-3">
      <a href="index.html" class="btn btn-primary">Regresar</a>
    </div>
  </div>
</body>
</html>
